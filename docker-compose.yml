# One command for a reviewer:   docker compose up --build
# then open http://localhost:8765/ (test page), /docs (API explorer), /site/ (docs site).
# Settings come from the environment or a .env file next to this one (see .env.example).
# Two containers: `db` (Postgres 17) and `app` (the service, image built from ./Dockerfile).
#
# Names come from the project name (default `team-notes`, or `-p <name>`): the image
# `<project>-app`, the data volume `<project>_pgdata`, the network `<project>_default`.
# So two checkouts run with different `-p` names never share a database.
name: team-notes

services:
  db:
    # Debian-based, not alpine, so the libc locales stay available; the cluster itself
    # uses Postgres's builtin C.UTF-8 locale (below), as docs/RUNNING.md explains.
    image: postgres:17
    environment:
      # Demo default; set a real one in .env before the first start (docs/RUNNING.md).
      # The superuser's copy is removed by docker/db-init once the app's role exists.
      POSTGRES_PASSWORD: ${TEAM_NOTES_DB_PASSWORD:-team-notes-demo}
      TEAM_NOTES_DB_PASSWORD: ${TEAM_NOTES_DB_PASSWORD:-team-notes-demo}
      # Builtin C.UTF-8 (Postgres 17): ILIKE lowercases with Unicode rules, so `café`
      # finds `CAFÉ`; text sorts by code point like SQLite; and no index depends on the
      # glibc version of a floating image tag.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --locale-provider=builtin --builtin-locale=C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    # No `ports`: only the app, on the compose network, reaches the database.
    healthcheck:
      # Over TCP on purpose: during first-start set-up the image runs a temporary
      # server on the socket only, so this passes only once the real server is up.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=team_notes", "--dbname=team_notes"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Localhost only by default: the seeded demo accounts share a published password.
      - "${TEAM_NOTES_BIND:-127.0.0.1}:${TEAM_NOTES_PORT:-8765}:8000"
    environment:
      # The password goes into a URL as is: use letters and digits (docs/RUNNING.md).
      DATABASE_URL: postgresql://team_notes:${TEAM_NOTES_DB_PASSWORD:-team-notes-demo}@db:5432/team_notes
      TEAM_NOTES_SEED: ${TEAM_NOTES_SEED:-1}

volumes:
  pgdata:
