[project]
name = "team-notes"
version = "0.1.0"
description = "Team Notes API: shared notes for small teams, with an edit lock and change long-polling."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8.0",
    "ruff>=0.17.6",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.8.2",
    "mkdocstrings[python]>=1.0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "sqlite_only: inspects SQLite internals (skipped when TEST_DATABASE_URL is set)",
    "postgres_only: inspects Postgres internals (needs TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "helpers"]
