  <polyline points="627.5,294 580,294 580,964" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="18" y="192" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start">
    <tspan x="18" dy="0">D8 One FastAPI process, one worker, sync handlers on 40 threads</tspan>
  </text>
  <text x="605" y="89.25" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1971c2" text-anchor="middle">
    <tspan x="605" dy="0">Client</tspan>
    <tspan x="605" dy="23.75">curl, test page (/), tests</tspan>
  </text>
  <text x="145" y="701.375" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2f9e44" text-anchor="middle">
    <tspan x="145" dy="0">D9 Auth routes</tspan>
    <tspan x="145" dy="23.75">POST /auth/signup</tspan>
    <tspan x="145" dy="23.75">POST /auth/login</tspan>
  </text>
  <text x="747.5" y="277.375" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#e03131" text-anchor="middle">
    <tspan x="747.5" dy="0">D9 Who are you?</tspan>
    <tspan x="747.5" dy="23.75">bearer token -&gt; user</tspan>
    <tspan x="747.5" dy="23.75">else 401; GET /me</tspan>
  </text>
  <text x="905" y="489.375" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#e03131" text-anchor="middle">
    <tspan x="905" dy="0">D1 Are you in this team?</tspan>
    <tspan x="905" dy="23.75">require_member</tspan>
    <tspan x="905" dy="23.75">else 404, never cached</tspan>
  </text>
  <text x="430" y="701.375" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2f9e44" text-anchor="middle">
    <tspan x="430" dy="0">Team routes</tspan>
    <tspan x="430" dy="23.75">/teams, /teams/{id},</tspan>
    <tspan x="430" dy="23.75">/teams/{id}/members</tspan>
  </text>
  <text x="745" y="701.375" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2f9e44" text-anchor="middle">
    <tspan x="745" dy="0">D2 Note and lock routes</tspan>
    <tspan x="745" dy="23.75">save needs live lock</tspan>
    <tspan x="745" dy="23.75">and a matching If-Match</tspan>
  </text>
  <text x="1095" y="701.375" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2f9e44" text-anchor="middle">
    <tspan x="1095" dy="0">D4 Changes route</tspan>
    <tspan x="1095" dy="23.75">async long poll, &lt;= 25 s</tspan>
    <tspan x="1095" dy="23.75">reads the tag via the store</tspan>
  </text>
  <text x="1135" y="1025.375" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#f08c00" text-anchor="middle">
    <tspan x="1135" dy="0">D4 Notifier (in memory)</tspan>
    <tspan x="1135" dy="23.75">note id -&gt; waiters</tspan>
    <tspan x="1135" dy="23.75">one process only</tspan>
  </text>
  <text x="650" y="1013.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#7048e8" text-anchor="middle">
    <tspan x="650" dy="0">D5 Store</tspan>
    <tspan x="650" dy="23.75">D3 conditional writes</tspan>
    <tspan x="650" dy="23.75">D6 40 connections</tspan>
    <tspan x="650" dy="23.75">= 40 threads</tspan>
  </text>
  <text x="510" y="1249.375" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#7048e8" text-anchor="middle">
    <tspan x="510" dy="0">SqliteStore</tspan>
    <tspan x="510" dy="23.75">D7 casefold search</tspan>
    <tspan x="510" dy="23.75">single writer</tspan>
  </text>
  <text x="790" y="1249.375" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#7048e8" text-anchor="middle">
    <tspan x="790" dy="0">PostgresStore</tspan>
    <tspan x="790" dy="23.75">D7 ILIKE search</tspan>
    <tspan x="790" dy="23.75">team row lock</tspan>
  </text>
  <text x="510" y="1473.25" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#e8590c" text-anchor="middle">
    <tspan x="510" dy="0">SQLite file, WAL</tspan>
    <tspan x="510" dy="23.75">default, no setup</tspan>
  </text>
  <text x="815" y="1461.375" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#e8590c" text-anchor="middle">
    <tspan x="815" dy="0">Postgres</tspan>
    <tspan x="815" dy="23.75">DATABASE_URL,</tspan>
    <tspan x="815" dy="23.75">Docker: own container</tspan>
  </text>
  <text x="320" y="380.8" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" stroke="#f9fafb" stroke-width="8" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">
    <tspan x="320" dy="0">email + password</tspan>
  </text>
  <text x="774.75" y="206" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" stroke="#f9fafb" stroke-width="8" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">
    <tspan x="774.75" dy="0">Bearer token</tspan>
  </text>
  <text x="911.25" y="396" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" stroke="#f9fafb" stroke-width="8" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">
    <tspan x="911.25" dy="0">/teams/{id}/...</tspan>
  </text>
  <text x="464.375" y="585" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" stroke="#f9fafb" stroke-width="8" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">
    <tspan x="464.375" dy="0">/teams</tspan>
  </text>
  <text x="1195" y="886" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" stroke="#f9fafb" stroke-width="8" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">
    <tspan x="1195" dy="0">listen, then read</tspan>
  </text>
  <text x="833.75" y="838" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" stroke="#f9fafb" stroke-width="8" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">
    <tspan x="833.75" dy="0">wake after commit</tspan>
  </text>
  <text x="914.98" y="947.824" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" stroke="#f9fafb" stroke-width="8" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">
    <tspan x="914.98" dy="0">wake on member removal</tspan>
  </text>
  <text x="507.28000000000003" y="420" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" stroke="#f9fafb" stroke-width="8" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">
    <tspan x="507.28000000000003" dy="0">session lookup</tspan>
  </text>
  <text x="10" y="-8" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" text-anchor="start">
    <tspan x="10" dy="0">Team Notes: architecture. Keys (T, E, D1 to D9, L, S, G) are explained in the README.</tspan>
  </text>
  <text x="-552" y="74" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1971c2" text-anchor="start">
    <tspan x="-552" dy="0">T  Targets</tspan>
  </text>
  <text x="-552" y="109" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start">
    <tspan x="-552" dy="0">About 20 teams of up to 50 people (D4)</tspan>
    <tspan x="-552" dy="21.25">Up to 10,000 notes per team, about 2 KB each (D7)</tspan>
    <tspan x="-552" dy="21.25">A list page or a search in under 200 ms (D7)</tspan>
    <tspan x="-552" dy="21.25">About 5 writes/s: 100 editors renewing every 20 s (D5)</tspan>
    <tspan x="-552" dy="21.25">Viewers hear of a save, lock or unlock within 1 s (D4)</tspan>
    <tspan x="-552" dy="21.25">A waiting viewer holds no thread or connection (D4, D6)</tspan>
    <tspan x="-552" dy="21.25">Outsiders learn nothing about a team (D1)</tspan>
    <tspan x="-552" dy="21.25">No edit lost silently (D2, D3)</tspan>
    <tspan x="-552" dy="21.25">A crashed editor blocks a note at most 60 s (D2)</tspan>
    <tspan x="-552" dy="21.25">Membership and edits read fresh; lists may lag (G)</tspan>
    <tspan x="-552" dy="21.25">One command to run, one to test</tspan>
  </text>
  <text x="-552" y="412" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#e8590c" text-anchor="start">
    <tspan x="-552" dy="0">E  Entities</tspan>
  </text>
  <text x="-552" y="447" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start">
    <tspan x="-552" dy="0">User, Session (only the token's hash is stored)</tspan>
    <tspan x="-552" dy="21.25">Team, Membership (team, user, admin | member)</tspan>
    <tspan x="-552" dy="21.25">Note (team, author, title, body, version)</tspan>
    <tspan x="-552" dy="21.25">Edit lock: columns on Note, holder, expiry, activity</tspan>
    <tspan x="-552" dy="21.25">Tag: version + live holder; viewers wait on it</tspan>
  </text>
  <text x="-552" y="618" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#495057" text-anchor="start">
    <tspan x="-552" dy="0">L  Limits</tspan>
  </text>
  <text x="-552" y="653" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start">
    <tspan x="-552" dy="0">Title 200 chars, body 100,000 chars, request 1 MB</tspan>
    <tspan x="-552" dy="21.25">200 members and 10,000 notes per team</tspan>
    <tspan x="-552" dy="21.25">Page 1 to 100 (cursor paging), q up to 200</tspan>
    <tspan x="-552" dy="21.25">Lock lease 60 s, renew every 20 s, idle 10 min</tspan>
    <tspan x="-552" dy="21.25">Long poll up to 25 s, 10 held per user</tspan>
    <tspan x="-552" dy="21.25">Token lasts 7 days</tspan>
    <tspan x="-552" dy="21.25">Write waits 5 s for a lock, then 503 busy</tspan>
  </text>
  <text x="1618" y="74" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#7048e8" text-anchor="start">
    <tspan x="1618" dy="0">D1 to D9  Decisions</tspan>
  </text>
  <text x="1618" y="109" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start">
    <tspan x="1618" dy="0">D1 Isolation: one membership check, 404 outside</tspan>
    <tspan x="1618" dy="21.25">D2 Edit lock: 60 s lease, 10 min idle, If-Match</tspan>
    <tspan x="1618" dy="21.25">D3 Each guarded write: one conditional statement</tspan>
    <tspan x="1618" dy="21.25">D4 Long poll woken by an in-memory notifier</tspan>
    <tspan x="1618" dy="21.25">D5 One store: SQLite, or Postgres as its own service</tspan>
    <tspan x="1618" dy="21.25">D6 40 connections = 40 threads, one per hop</tspan>
    <tspan x="1618" dy="21.25">D7 Cursor-paged lists; search scans one team</tspan>
    <tspan x="1618" dy="21.25">D8 Sync handlers on 40 threads, one async route</tspan>
    <tspan x="1618" dy="21.25">D9 Opaque bearer tokens, argon2 passwords</tspan>
  </text>
  <text x="1618" y="368" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#e03131" text-anchor="start">
    <tspan x="1618" dy="0">S  Scope cuts</tspan>
  </text>
  <text x="1618" y="403" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start">
    <tspan x="1618" dy="0">Concurrent editing: one editor at a time instead</tspan>
    <tspan x="1618" dy="21.25">Content push to viewers, presence, cursors</tspan>
    <tspan x="1618" dy="21.25">Rich text, attachments, trash, history, tags</tspan>
    <tspan x="1618" dy="21.25">Private notes, per-note sharing, invitations</tspan>
    <tspan x="1618" dy="21.25">Role changes, renaming or deleting teams</tspan>
    <tspan x="1618" dy="21.25">Logout, password reset, SSO, rate limiting</tspan>
    <tspan x="1618" dy="21.25">Idempotency keys, migrations, metrics</tspan>
  </text>
  <text x="1618" y="618" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f9e44" text-anchor="start">
    <tspan x="1618" dy="0">G  Growth path (not built)</tspan>
  </text>
  <text x="1618" y="653" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start">
    <tspan x="1618" dy="0">1. Several processes: LISTEN/NOTIFY to each notifier</tspan>
    <tspan x="1618" dy="21.25">2. Search too slow: FTS5 or tsvector, same database</tspan>
    <tspan x="1618" dy="21.25">3. Reads outgrow a machine: replicas for lists</tspan>
    <tspan x="1618" dy="21.25">4. A measured hot read: cache, never membership</tspan>
    <tspan x="1618" dy="21.25">5. Data outgrows a database: shard by team_id</tspan>
  </text>
</svg>
